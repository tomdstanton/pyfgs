[project]
name = "pyfgs"
description = "Python bindings to FragGeneScanRs for fast, error-tolerant bacterial ORF prediction"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["version"]
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["bioinformatics", "genome", "orf", "gene", "fraggenescan", "metagenomics", "hmm", "rust", "pyo3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.2.6",
]

[project.urls]
Homepage = "https://tomdstanton.github.io/pyfgs/"
Repository = "https://github.com/tomdstanton/pyfgs"
Documentation = "https://tomdstanton.github.io/pyfgs/"
"Bug Tracker" = "https://github.com/tomdstanton/pyfgs/issues"
Coverage = "https://codecov.io/gh/tomdstanton/pyfgs/"
Builds = "https://github.com/tomdstanton/pyfgs/actions"
PyPI = "https://pypi.org/project/pyfgs"

[project.scripts]
pyfgs = "pyfgs.cli:main"

[dependency-groups]
test = ["pytest", "pytest-cov"]
docs = [
    "zensical",
    "mkdocstrings[python]",
]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "flameprof>=0.4",
]
benches = [
    "pyrodigal>=3.7.1",
    "pytest-benchmark>=5.2.3",
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[tool.maturin]
binding = "pyo3"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "pyfgs._pyfgs"

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "6.0"

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "UP", "I001", "T201", "T203"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["T201"]
"scripts/*.py" = ["E402"]
