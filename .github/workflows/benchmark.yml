name: Continuous Benchmarking

# Run whenever code is merged into main
on:
  push:
    branches:
      - main

# Grant permissions to push the benchmark charts to GitHub Pages
permissions:
  contents: write
  pages: write

jobs:
  benchmark:
    name: Run & Publish Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Run Pytest Benchmark
        run: just benchmark

      - name: Clean working directory (Nuclear Option)
        run: git reset --hard HEAD

      - name: Store and Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: 'benchmark-data'

          # If a commit accidentally makes pyfgs 50% slower, it will fail the CI!
          alert-threshold: '150%'
          fail-on-alert: true
