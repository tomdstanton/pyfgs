name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Sync Cargo.toml version to Release Tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG_VERSION" ]; then
            echo "Syncing Cargo.toml version to $TAG_VERSION..."
            python3 -c "import re; content = open('Cargo.toml').read(); content = re.sub(r'^version\s*=\s*\".*\"', 'version = \"' + '$TAG_VERSION' + '\"', content, count=1); open('Cargo.toml', 'w').write(content)"
          fi

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync Cargo.toml version to Release Tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG_VERSION" ]; then
            echo "Syncing Cargo.toml version to $TAG_VERSION..."
            python3 -c "import re; content = open('Cargo.toml').read(); content = re.sub(r'^version\s*=\s*\".*\"', 'version = \"' + '$TAG_VERSION' + '\"', content, count=1); open('Cargo.toml', 'w').write(content)"
          fi

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  sync-repo-version:
    name: 🔄 Sync Cargo.toml in main
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Commit Cargo.toml version bump back to main if updated
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG_VERSION" ]; then
            python3 -c "import re; content = open('Cargo.toml').read(); content = re.sub(r'^version\s*=\s*\".*\"', 'version = \"' + '$TAG_VERSION' + '\"', content, count=1); open('Cargo.toml', 'w').write(content)"
            python3 scripts/generate_release_notes.py
            git add Cargo.toml docs/releases.md
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: bump version to $TAG_VERSION and update release notes [skip ci]"
              git push origin main
            fi
          fi

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, sync-repo-version]
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write  # REQUIRED: Allows the OIDC token to be generated for PyPI
      contents: read   # REQUIRED: To download artifacts or read the repo

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
