[project]
site_name = "pyfgs Docs"
site_description = "Python bindings to FragGeneScanRs for fast, error-tolerant bacterial ORF prediction"
site_url = "https://tomdstanton.github.io/pyfgs"
site_author = "Tom Stanton"
repo_url = "https://github.com/tomdstanton/pyfgs"
repo_name = "tomdstanton/pyfgs"
edit_uri = "edit/master/docs/"
language = "en"
copyright = """
Copyright &copy; 2026 <a href="https://tomdstanton.com" target="_blank">Tom Stanton</a>
"""
docs_dir = "docs"
site_dir = "site"
watch = ["python"]

nav = [
    { Home = "index.md" },
    { "API Reference" = [
      "reference/results.md",
      "reference/models.md",
      "reference/io.md",
    ] },
    "cli.md",
    "benchmarks.md",
    { Development = [
        "contributing.md",
        "conduct.md",
        "releases.md"
  ] },
]

plugins = [
  "search",
  { mkdocstrings = { handlers = { python = { paths = ["python"], inventories = ["https://docs.python.org/3/objects.inv"], options = { docstring_style = "google", docstring_section_style = "list", relative_crossrefs = true, scoped_crossrefs = true, signature_crossrefs = true, unwrap_annotated = true, filters = "public", inherited_members = true, summary = true, heading_level = 2, parameter_headings = true, type_parameter_headings = true, show_root_heading = false, show_root_full_path = false, show_symbol_type_heading = true, show_symbol_type_toc = true, line_length = 88, merge_init_into_class = true, separate_signature = true, show_signature_annotations = true, show_signature_type_parameters = true, backlinks = "tree", show_bases = false, show_inheritance_diagram = true, docstring_options = { ignore_init_summary = true } } } } } },
  { reading-time = { words_per_minute = 200 } },
  "include-markdown",
  "offline",
]

[project.theme]
name = "material"
custom_dir = "overrides"
icon.repo = "fontawesome/brands/github"
font.text = "Manrope"
font.code = "IBM Plex Mono"

palette = [
    { media = "(prefers-color-scheme)", toggle = { icon = "lucide/sun-moon", name = "Switch to light mode" } },
    { media = "(prefers-color-scheme: light)", scheme = "default", toggle = { icon = "lucide/sun", name = "Switch to dark mode" } },
    { media = "(prefers-color-scheme: dark)", scheme = "slate", toggle = { icon = "lucide/moon", name = "Switch to system preference" } }
]

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "header.autohide",
    "navigation.top",
    "navigation.footer",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.tracking",
    # "navigation.sections",
    # "navigation.expand",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.path",
    "search.suggest",
    "search.highlight",
    "search.share",
    "toc.follow",
    # "toc.integrate",
]

[project.extra]
social = [
    { icon = "simple/pypi", link = "https://pypi.org/project/pyfgs" },
    { icon = "simple/anaconda", link = "https://anaconda.org/bioconda/pyfgs" },
    { icon = "lucide/book-open-text", link = "https://tomdstanton.github.io/pyfgs" },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true, title = "On this page" }

"pymdownx.arithmatex" = { generic = true }
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.highlight" = { anchor_linenums = true, use_pygments = true, linenums = true, auto_title = true }
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { base_path = ["."] }
"pymdownx.superfences" = { custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ] }
"pymdownx.tabbed" = { alternate_style = true }

# "zensical.extensions.glightbox" = {}
