[package]
name = "pyfgs"
version = "0.0.2"
edition = "2024"

[lib]
name = "_pyfgs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.0" }
frag_gene_scan_rs = "1.1.0"
seq_io = "0.3.2"
mimalloc = "0.1"
rayon = "1.10"
pyo3-stub-gen = "0.23.0"
numpy = "0.29.0"

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = []
